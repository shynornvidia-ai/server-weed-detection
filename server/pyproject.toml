[project]
name = "weed-detector-server"
version = "0.1.0"
description = "Phan 2 - Server nhan du lieu tu edge, visualize ban do heatmap co"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.28",
]

[project.scripts]
weed-server = "weed_server.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["uv_build>=0.9.0,<1.0.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "weed_server"
